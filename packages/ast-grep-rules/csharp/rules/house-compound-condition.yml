id: house-compound-condition
language: csharp
severity: error
message: "house rule named-boolean-condition: extract a compound or comparing condition into a named boolean first"
rule:
  kind: binary_expression
  has:
    field: operator
    regex: ^(&&|\|\||==|!=|<=|>=|<|>)$
  inside:
    field: condition
    stopBy: neighbor
    any:
      - kind: if_statement
      - kind: while_statement
