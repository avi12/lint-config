id: house-abbreviation
language: cpp
severity: error
message: "house rule no-abbreviations: write the full word (direction, not dir); the deny-list is in this rule"
rule:
  any:
    - kind: identifier
      inside:
        field: declarator
        stopBy: neighbor
        any:
          - kind: init_declarator
          - kind: declaration
          - kind: parameter_declaration
          - kind: function_declarator
    - kind: field_identifier
      inside:
        field: declarator
        stopBy: neighbor
        kind: field_declaration
  regex: "(^|_)(dir|msg|cfg|btn|buf|tmp|idx|cnt|val|arr|obj|evt|req|res|resp|src|dst|pkg|func|cb|prev|curr|ptr|str|params|attr|elem|cmd|mgr|proc|num|fmt)(_|$)|(^|[a-z0-9])(Dir|Msg|Cfg|Btn|Buf|Tmp|Idx|Cnt|Val|Arr|Obj|Evt|Req|Res|Resp|Src|Dst|Pkg|Func|Cb|Prev|Curr|Ptr|Str|Params|Attr|Elem|Cmd|Mgr|Proc|Num|Fmt)([A-Z]|$)"
